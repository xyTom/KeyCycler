name = "openai-key-cycler"
main = "src/worker.js"
compatibility_date = "2025-07-05"

[[durable_objects.bindings]]
name = "KEY_SHARD"
class_name = "KeyShardV2"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KeyShardV2"]

[[d1_databases]]
binding = "KEY_DB"
database_name = "keycycler"
database_id = "ef974098-0b1a-4ead-bc1f-d892f1663236"

[[queues.producers]]
binding = "KEY_EVENTS"
queue = "key-events"

[[queues.consumers]]
queue = "key-events"
max_batch_size = 50
max_batch_timeout = 5
max_retries = 3

[observability.logs]
enabled = true
